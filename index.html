    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 9h18M7.5 13h2M12 13h2M7.5 17h2M12 17h2"/></symbol>

  <div class="site-background" aria-hidden="true"><i class="ambient ambient-left"></i><i class="ambient ambient-right"></i></div>
  <div class="app-wrap">
    <main class="card" id="inicio">
      <div class="edge-flourish left-edge" aria-hidden="true"></div>
      <div class="edge-flourish right-edge" aria-hidden="true"></div>
      <header class="masthead">
        <div class="topline"><span class="topline-rule"></span> NAIL ART · BEAUTY <span class="topline-rule"></span></div>
        <div class="logo-plate">
          <img src="assets/logo-original.png" alt="Logo oficial Dibújame Nails Studio en rosa y dorado" width="1536" height="1024" class="brand-logo" fetchpriority="high" draggable="false">
        </div>
        <div class="intro-block">
          <p class="intro-script">Conéctate con nosotros <span aria-hidden="true">♡</span></p>
          <p class="intro-subtitle">UN ESPACIO HECHO PARA TI</p>
        </div>
      </header>

      <nav class="action-stack" aria-label="Contactos y redes sociales">
        <a class="action-link action-whatsapp" data-link="whatsapp" href="https://wa.me/522284045606" aria-label="Contáctanos por WhatsApp">

          <span class="vertical-stroke" aria-hidden="true"></span>

          <span class="vertical-stroke" aria-hidden="true"></span>
          <span class="action-copy"><strong>Agenda tu cita</strong><small>Reserva por WhatsApp</small></span>
          <span class="action-arrow" aria-hidden="true"><svg class="line-icon"><use href="#i-arrow"/></svg></span>
        </a>
        <a class="action-link action-instagram" data-link="instagram" href="https://www.instagram.com/dibujame_nails/" aria-label="Visita nuestro Instagram">
          <span class="icon-wrap"><svg class="line-icon" aria-hidden="true"><use href="#i-instagram"/></svg></span>
          <span class="vertical-stroke" aria-hidden="true"></span>
          <span class="action-copy"><strong>Instagram</strong><small>Mira nuestros diseños</small></span>
          <span class="action-arrow" aria-hidden="true"><svg class="line-icon"><use href="#i-arrow"/></svg></span>
        </a>
        <a class="action-link action-facebook" data-link="facebook" href="https://www.facebook.com/profile.php?id=61552756146185" aria-label="Visita nuestro Facebook">

          <span class="vertical-stroke" aria-hidden="true"></span>
          <span class="action-copy"><strong>Facebook</strong><small>Síguenos y conoce más</small></span>
          <span class="action-arrow" aria-hidden="true"><svg class="line-icon"><use href="#i-arrow"/></svg></span>
        </a>
        <a class="action-link action-tiktok" data-link="tiktok" href="https://www.tiktok.com/@bonitatunailsx" aria-label="Visita nuestro TikTok">
          <span class="icon-wrap"><svg class="line-icon" aria-hidden="true"><use href="#i-tiktok"/></svg></span>
          <span class="vertical-stroke" aria-hidden="true"></span>
          <span class="action-copy"><strong>TikTok</strong><small>Videos y tendencias</small></span>
          <span class="action-arrow" aria-hidden="true"><svg class="line-icon"><use href="#i-arrow"/></svg></span>
        </a>
        <a class="action-link action-ubicacion" data-link="ubicacion" href="https://www.google.com/maps?q=19.556879,-96.916771" aria-label="Cómo llegar a Dibújame Nails Studio en Google Maps">
          <span class="icon-wrap"><svg class="line-icon" aria-hidden="true"><use href="#i-pin"/></svg></span>
          <span class="vertical-stroke" aria-hidden="true"></span>
          <span class="action-copy"><strong>Ubicación</strong><small id="mapCaption">Cómo llegar al salón</small></span>
          <span class="action-arrow" aria-hidden="true"><svg class="line-icon"><use href="#i-arrow"/></svg></span>
        </a>

      <div class="signature" aria-hidden="true"><span></span><b>♡</b><span></span></div>

        <p>¡Luce unas uñas increíbles!</p>
        <button id="shareButton" class="share-button" type="button"><svg class="line-icon" aria-hidden="true"><use href="#i-share"/></svg> Compartir tarjeta</button>
