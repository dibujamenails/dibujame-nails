<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4d1cf" />
  <meta name="description" content="Dibújame Nails Studio: agenda tu cita, escríbenos y descubre nuestras redes sociales." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dibújame | Nails Studio" />
  <meta property="og:description" content="Conéctate con nosotros y luce unas uñas increíbles." />
  <meta property="og:image" content="https://dibujamenails.github.io/dibujame-nails/assets/logo-original.png" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="assets/tarjeta-digital.webp" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
  <title>Dibújame Nails Studio | Conéctate</title>
</head>
<body>
  <main class="digital-card" aria-label="Tarjeta digital de Dibújame Nails Studio">
    <h1 class="sr-only">Dibújame Nails Studio</h1>
    <p class="sr-only">Conéctate con nosotros. Elige uno de los siguientes enlaces.</p>
    <img class="card-art" src="assets/tarjeta-digital.webp" alt="" width="1086" height="1448" fetchpriority="high" draggable="false" />
    <nav class="link-hotspots" aria-label="Contacto y redes sociales">
      <a class="touch-link whatsapp" data-action="whatsapp" href="#" aria-label="Contactar por WhatsApp"><span class="sr-only">WhatsApp — Contáctanos</span></a>
      <a class="touch-link agenda" data-action="agenda" href="#" aria-label="Agendar una cita por WhatsApp"><span class="sr-only">Agenda tu cita</span></a>
      <a class="touch-link instagram" data-action="instagram" href="https://www.instagram.com/dibujame_nails/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram de Dibújame Nails Studio"><span class="sr-only">Instagram</span></a>
      <a class="touch-link facebook" data-action="facebook" href="https://www.facebook.com/profile.php?id=61552756146185" target="_blank" rel="noopener noreferrer" aria-label="Abrir Facebook de Dibújame Nails Studio"><span class="sr-only">Facebook</span></a>
      <a class="touch-link tiktok" data-action="tiktok" href="#" aria-label="Abrir TikTok"><span class="sr-only">TikTok</span></a>
      <a class="touch-link ubicacion" data-action="ubicacion" href="#" aria-label="Ver ubicación en Google Maps"><span class="sr-only">Ubicación</span></a>
    </nav>
  </main>
  <footer class="card-footer">
    <button id="shareBtn" class="share-btn" type="button" aria-label="Compartir tarjeta digital">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 13.5 6.6 4m0-11-6.6 4"/></svg>
      Compartir tarjeta
    </button>
  </footer>
  <div id="statusToast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
